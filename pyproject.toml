[project]
name = "ministar"
version = "0.0.0"
description = "Automation for untracked DSLR astrophotography"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
ui = ["pyside6>=6.8"]
imaging = ["opencv-python-headless>=4.10"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ministar = "ministar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ministar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
