[project]
name = "ministar"
version = "0.0.0"
description = "Automation for untracked DSLR astrophotography"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Deliberately no "License ::" classifier: with a PEP 639 SPDX string above,
# tooling treats the two as conflicting sources of truth.
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=2.0",
    # Runtime, not optional: decoding live-view JPEGs for focus measurement, and
    # the registration/warp path in the live stack (brief 15). Headless avoids
    # pulling GUI libraries into a camera-only install.
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Brief 14 sec.2 supersedes PySide6 (LGPL) with NiceGUI (MIT) for both the
# desktop window and the browser/phone console, which also removes the only
# copyleft dependency from the runtime.
ui = ["nicegui>=2.0"]
# Bench harness in tools/ decodes live-view JPEG; needs Pillow, which the
# package itself does not. tools/setup.bat installs [dev], so install this too
# to run tools/focus_ui.py from a fresh checkout.
bench = ["pillow>=10"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ministar = "ministar.cli:main"

[build-system]
# >=1.27 needed for PEP 639 `license` / `license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ministar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
